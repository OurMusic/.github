<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E0C"/>
      <stop offset="52%" stop-color="#111713"/>
      <stop offset="100%" stop-color="#19281D"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 75) rotate(140) scale(420 260)">
      <stop offset="0%" stop-color="#B7E887" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#B7E887" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 270) rotate(25) scale(360 190)">
      <stop offset="0%" stop-color="#253B24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#253B24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#B7E887" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="clipCard">
      <rect x="1" y="1" width="1198" height="308" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipCard)">
    <!-- Background -->
    <rect x="0" y="0" width="1200" height="310" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="310" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="310" fill="url(#glowRight)"/>
    <rect x="0" y="0" width="1200" height="310" fill="url(#glowLeft)"/>

    <!-- Left accent bar -->
    <rect x="0" y="0" width="6" height="310" fill="#B7E887"/>

    <!-- Top kicker badge -->
    <rect x="64" y="44" width="302" height="28" rx="14" fill="#1F3220" stroke="#B7E887" stroke-opacity="0.35"/>
    <circle cx="82" cy="58" r="4" fill="#B7E887"/>
    <text x="96" y="62.5" fill="#B7E887" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.6">PLATAFORMA MUSICAL FULL-STACK</text>

    <!-- Official OurMusic Waveform Icon (audio-lines.svg scaled cleanly) + Wordmark -->
    <g transform="translate(64, 98)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#19261B" stroke="#303831" stroke-width="1.5"/>
      <g transform="translate(12, 12)" stroke="#B7E887" stroke-width="2.6" stroke-linecap="round">
        <line x1="2.7" y1="13.3" x2="2.7" y2="17.3"/>
        <line x1="8.0" y1="8.0"  x2="8.0" y2="22.7"/>
        <line x1="13.3" y1="4.0" x2="13.3" y2="28.0"/>
        <line x1="18.7" y1="10.7" x2="18.7" y2="20.0"/>
        <line x1="24.0" y1="6.7" x2="24.0" y2="24.0"/>
        <line x1="29.3" y1="13.3" x2="29.3" y2="17.3"/>
      </g>
      <text x="72" y="43" fill="#F2F4ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.6">OurMusic</text>
      <circle cx="288" cy="36" r="6" fill="#B7E887"/>
    </g>

    <!-- Subtitle -->
    <text x="64" y="192" fill="#CAD6C8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">
      Cada som, uma nova descoberta. Catálogo colaborativo com player integrado.
    </text>

    <!-- Tech pills row -->
    <g transform="translate(64, 224)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
      <rect x="0" y="0" width="90" height="32" rx="16" fill="#191D1A" stroke="#303831"/>
      <text x="45" y="20.5" text-anchor="middle" fill="#E6EFE4">.NET 10</text>

      <rect x="102" y="0" width="102" height="32" rx="16" fill="#191D1A" stroke="#303831"/>
      <text x="153" y="20.5" text-anchor="middle" fill="#E6EFE4">React 19</text>

      <rect x="216" y="0" width="114" height="32" rx="16" fill="#191D1A" stroke="#303831"/>
      <text x="273" y="20.5" text-anchor="middle" fill="#E6EFE4">TypeScript</text>

      <rect x="342" y="0" width="118" height="32" rx="16" fill="#191D1A" stroke="#303831"/>
      <text x="401" y="20.5" text-anchor="middle" fill="#E6EFE4">SQL Server</text>

      <rect x="472" y="0" width="126" height="32" rx="16" fill="#253B24" stroke="#B7E887" stroke-opacity="0.4"/>
      <text x="535" y="20.5" text-anchor="middle" fill="#B7E887">JWT + BCrypt</text>

      <rect x="610" y="0" width="106" height="32" rx="16" fill="#191D1A" stroke="#303831"/>
      <text x="663" y="20.5" text-anchor="middle" fill="#E6EFE4">Cloudinary</text>
    </g>

    <!-- Decorative Soundwave Visual on Right -->
    <g transform="translate(880, 62)">
      <rect x="0" y="0" width="260" height="186" rx="16" fill="#141B16" fill-opacity="0.92" stroke="#303831" stroke-width="1.4"/>
      <text x="22" y="30" fill="#B7E887" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4">NOW PLAYING · ECOSSISTEMA</text>
      <line x1="22" y1="42" x2="238" y2="42" stroke="#303831" stroke-width="1"/>

      <!-- Equalizer Bars -->
      <g transform="translate(28, 60)">
        <rect x="0"   y="34" width="10" height="36" rx="5" fill="#253B24"/>
        <rect x="18"  y="20" width="10" height="50" rx="5" fill="#46703D"/>
        <rect x="36"  y="6"  width="10" height="64" rx="5" fill="#B7E887"/>
        <rect x="54"  y="24" width="10" height="46" rx="5" fill="#7FB564"/>
        <rect x="72"  y="12" width="10" height="58" rx="5" fill="#B7E887"/>
        <rect x="90"  y="30" width="10" height="40" rx="5" fill="#46703D"/>
        <rect x="108" y="0"  width="10" height="70" rx="5" fill="#B7E887"/>
        <rect x="126" y="18" width="10" height="52" rx="5" fill="#7FB564"/>
        <rect x="144" y="28" width="10" height="42" rx="5" fill="#46703D"/>
        <rect x="162" y="10" width="10" height="60" rx="5" fill="#B7E887"/>
        <rect x="180" y="26" width="10" height="44" rx="5" fill="#7FB564"/>
        <rect x="198" y="38" width="10" height="32" rx="5" fill="#253B24"/>
      </g>

      <!-- Mini progress bar -->
      <rect x="22" y="148" width="216" height="5" rx="2.5" fill="#263128"/>
      <rect x="22" y="148" width="138" height="5" rx="2.5" fill="#B7E887"/>
      <circle cx="160" cy="150.5" r="5" fill="#F2F4ED"/>
      <text x="22" y="170" fill="#A2ADA3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5">API REST · SPA · SQL Server</text>
      <text x="238" y="170" text-anchor="end" fill="#B7E887" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700">v1.0</text>
    </g>
  </g>

  <!-- Crisp outer border -->
  <rect x="1" y="1" width="1198" height="308" rx="18" stroke="#303831" stroke-width="1.5"/>
</svg>
